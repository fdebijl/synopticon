# Synopticon configuration. Copy to config.toml (or /data/config.toml in Docker).
# Every value can be overridden by env vars: SYNOPTICON_<SECTION>__<KEY>,
# e.g. SYNOPTICON_NAS__URL. Credentials are best kept env-only.

[nas]
url = "https://nas.example.com"     # your Synology, any reachable scheme://host[:port]
# web_url = "https://nas.example.com" # base for review-UI deep links; defaults to `url`
verify_tls = true
account = ""                        # recommend a dedicated NAS user with Photos access
# password: set via SYNOPTICON_NAS__PASSWORD
spaces = ["personal"]               # "personal" (SYNO.Foto) and/or "shared" (SYNO.FotoTeam)
requests_per_second = 4.0           # be nice to the NAS; reads
write_requests_per_second = 1.0     # writes are throttled harder
timeout_s = 60

[storage]
# Local (non-Docker) runs: paths are relative to where you run `synopticon`.
# In Docker these two are overridden by the image env to the /data and /models
# volume mounts, which docker-compose.yml maps back to ./data and ./models.
data_dir = "./data"                 # sqlite db, crops, reports, originals cache
models_dir = "./models"             # ONNX models (populate via `synopticon models download`)
keep_originals = false              # true = keep every downloaded original (needs ~1TB+)
originals_cache_gb = 50.0           # LRU eviction budget when keep_originals = false

[database]
# Where Synopticon keeps its own data (photo index, faces, review decisions).
# Never your NAS. The default needs no setup at all: a single SQLite file under
# data_dir. Switch to postgres only if you already run one -- and use
# `synopticon db-migrate` to carry an existing library across.
backend = "sqlite"                  # sqlite | postgres
# Everything below is ignored unless backend = "postgres". Needs the [postgres]
# extra: uv sync --extra postgres
# host = "localhost"
# port = 5432
# user = "synopticon"
# database = "synopticon"           # must already exist; Synopticon creates the tables
# sslmode = "prefer"                # disable | allow | prefer | require | verify-ca | verify-full
# pool_size = 5
# Pass the password env-only: SYNOPTICON_DATABASE__PASSWORD=...
# A managed provider's ready-made connection string overrides every field above:
# SYNOPTICON_DATABASE__URL=postgresql://user:pass@host:5432/synopticon

[inference]
device = "auto"                     # auto | cpu | cuda; "auto"/"cuda" use the GPU
                                    # only if onnxruntime-gpu is installed (see
                                    # README "GPU acceleration"), else fall back to CPU
device_id = 0                       # CUDA device ordinal for multi-GPU hosts
batch_size = 16

# The defaults below are recall-first: they favour catching every real face at
# the cost of some false positives (leaves, fabric, hair textures detected as
# faces). If your review queue fills with non-faces, tighten precision here —
# biggest lever first. Any change to this section bumps the pipeline version, so
# already-processed photos are automatically re-extracted on the next run.
[detection]
scales = [1.0, 2.0]                 # multi-scale detection passes. The 2.0 upscale
                                    # pass boosts recall on small/distant faces but
                                    # is a common false-positive source (cubic
                                    # upscaling turns texture into face-like blobs).
                                    # Set to [1.0] to cut false positives.
scrfd_score = 0.30                  # SCRFD confidence floor. Lower = more recall,
yolo_score = 0.35                   # more false positives. Raise both toward ~0.50
                                    # (the usual operating point) to reject textures
                                    # that only weakly resemble faces — the single
                                    # most effective knob for precision.
nms_iou = 0.45
cross_iou = 0.50                    # cross-detector union dedup
min_face_px = 20                    # drop faces smaller than this (min side, px).
                                    # Raise to 32-40 to remove tiny texture crops.

[restoration]
enabled = false                     # requires the [restore] extra (pinned torch)
trigger_px = 80
fidelity = 0.7                      # CodeFormer w
disagreement_cos = 0.30             # orig-vs-restored embedding disagreement flag

[clustering]
knn_k = 64
edge_threshold = 0.50
algorithm = "chinese_whispers"      # or "hdbscan"
cw_iterations = 30
seed = 42

[crossref]
majority = 0.60                     # vote fraction to map a cluster to a person
min_labeled = 3
assign_sim = 0.55                   # below this an assign becomes a low-confidence flag
