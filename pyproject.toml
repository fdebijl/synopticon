[project]
name = "synopticon"
version = "0.1.0"
description = "Ensemble face-recognition supplement for Synology Photos: catch what it missed, correct what it got wrong."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "onnxruntime>=1.17",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "scipy>=1.12",
    "hdbscan>=0.8.33",
    "jinja2>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Restoration is isolated behind pins: basicsr imports
# torchvision.transforms.functional_tensor, removed in torchvision >= 0.17.
restore = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "basicsr>=1.4.2",
    "facexlib>=0.3.0",
]
review = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
faiss = ["faiss-cpu>=1.8"]
# Needed only to run scripts/export_*_onnx.py once.
export = ["torch==2.1.2", "onnx>=1.15"]

[project.scripts]
synopticon = "synopticon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synopticon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
