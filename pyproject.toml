[project]
name = "synopticon"
version = "0.5.0"
description = "Ensemble face-recognition supplement for Synology Photos: catch what it missed, correct what it got wrong."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.27.0",
    "numpy>=2.4.6,<3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=10",
    "pillow-heif>=1.5.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "scipy>=1.12",
    "hdbscan>=0.8.33",
    "jinja2>=3.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# ONNX Runtime ships as two mutually-exclusive PyPI packages sharing the same
# import namespace. Pick exactly one: `cpu` (default) or `gpu` (CUDA). They are
# declared conflicting under [tool.uv] so `uv sync --extra gpu` resolves cleanly.
cpu = ["onnxruntime>=1.28.0"]
# The [cuda,cudnn] extra pulls NVIDIA's CUDA + cuDNN runtime wheels from PyPI, so
# a GPU install needs only the NVIDIA driver -- no system CUDA toolkit. Pinned to
# the CUDA 12 line (<1.27): 1.27 switched to CUDA 13, whose nvidia-*-cu13 wheels
# are still pre-releases uv won't resolve by default. create_session() calls
# preload_dlls() so onnxruntime finds the wheel-provided libs.
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.28.0"]
# Restoration is isolated behind pins: basicsr imports
# torchvision.transforms.functional_tensor, removed in torchvision >= 0.17.
restore = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "basicsr>=1.4.2",
    "facexlib>=0.3.0",
]
review = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "tomlkit>=0.12",
]
faiss = ["faiss-cpu>=1.8"]
# Needed only to run scripts/export_*_onnx.py once.
export = ["torch==2.1.2", "onnx>=1.15"]

[project.scripts]
synopticon = "synopticon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.uv]
# onnxruntime (cpu) and onnxruntime-gpu share one import namespace and can't
# coexist. The gpu build also needs nvidia-cudnn-cu12>=9, while the pinned
# torch==2.1.2 in restore/export requires cuDNN 8.9 -- so gpu is mutually
# exclusive with those too. (CPU inference + restore/export compose fine.)
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
    [{ extra = "gpu" }, { extra = "restore" }],
    [{ extra = "gpu" }, { extra = "export" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synopticon"]
# The Vue SPA is built into src/synopticon/web/dist (gitignored). Hatchling
# excludes VCS-ignored files by default, so without this the wheel would ship
# without the frontend. Build the SPA (cd frontend && npm run build) before
# building the wheel.
artifacts = ["src/synopticon/web/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
