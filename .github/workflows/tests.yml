name: tests

on:
  push:
    branches:
      - "**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # cpu/gpu are declared conflicting, so --all-extras can't resolve. The
      # mocked suite only needs onnxruntime (cpu), FastAPI (review) and faiss;
      # restore/export/gpu are excluded deliberately. Tests never touch a NAS.
      - name: Sync dependencies
        run: uv sync --extra cpu --extra review --extra faiss

      - name: Run test suite
        run: uv run --extra cpu --extra review --extra faiss pytest tests/unit/ -q

  # Builds the Vue SPA: `npm run build` runs `vue-tsc -b` (strict typecheck) then
  # `vite build`. Independent of the Node-free `unit` job.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
