name: tests

on:
  push:
    branches:
      - "**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # cpu/gpu are declared conflicting, so --all-extras can't resolve. The
      # mocked suite only needs onnxruntime (cpu), FastAPI (review) and faiss;
      # restore/export/gpu are excluded deliberately. Tests never touch a NAS.
      - name: Sync dependencies
        run: uv sync --extra cpu --extra review --extra faiss

      - name: Run test suite
        run: uv run --extra cpu --extra review --extra faiss pytest tests/unit/ -q
